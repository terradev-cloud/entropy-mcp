name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # stamp-mcp is on PyPI; pyproject declares `stamp-mcp>=0.5.0`.
      - name: Install dependencies
        run: pip install -e ".[dev,http]"

      - name: Run tests
        run: python -m pytest tests -q --cov=entropy_mcp --cov-report=term-missing
